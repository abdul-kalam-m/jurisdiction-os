# Jersey City playbook (OPERATING_GUIDE.md §5.3). Drafted with LLM-assisted
# research from real, cited official sources -- verified: false until the
# owner reviews it (§5.3's own mechanism: unverified playbooks render with
# a "draft -- not yet verified" banner in the app, no fact ships without
# a citation regardless of verified status).
jurisdiction: "Jersey City"
state: "NJ"
verified: false
statutory_framework:
  description: >
    Jersey City development review sits under New Jersey's statewide
    Municipal Land Use Law (MLUL), same as every NJ municipality in this
    project's set -- site plan review authority and the two variance
    types (bulk/"c" and use/"d") are state statute, not city-specific.
  citations:
    - name: "N.J.S.A. 40:55D-37 (site plan review)"
      url: "https://www.nj.gov/state/bac/planning/documents/mlul022017.pdf"
    - name: "N.J.S.A. 40:55D-70 (variances)"
      url: "https://law.justia.com/codes/new-jersey/title-40/section-40-55d-70/"
local_code:
  zoning: {chapter: "Chapter 345 (Zoning)", url: "https://library.municode.com/nj/jersey_city/codes/code_of_ordinances?nodeId=CH345ZO"}
  planning_board: {chapter: "Chapter 56 (Planning Board)", url: "https://library.municode.com/nj/jersey_city/codes/code_of_ordinances?nodeId=CH56PLBO"}
  note: >
    Site plan approval applies citywide across all zones and Redevelopment
    Plan areas (confirmed live, Phase 3 research) -- meaning both asset
    types below almost always trigger at least site plan review, not just
    the zones a first guess might assume.
permit_paths:
  multifamily:
    triggering_conditions: ["new construction", "conversion adding units", "site work affecting parking/access"]
    likely_permits: ["Zoning permit/certificate", "Site plan approval (Planning Board)", "Building permit (DOB)"]
    hearing_likelihood: "variance-likely"
    hearing_likelihood_basis: >
      Jersey City's zoning map is a dense patchwork of Redevelopment Plan
      areas with their own bulk/use standards distinct from the base
      zoning ordinance -- a specific parcel's by-right vs variance-needed
      status depends on which plan area it falls in, not determinable
      generically. Marked variance-likely as the conservative default; the
      fit-checker output should say so explicitly rather than imply
      certainty this playbook's town-wide research doesn't support.
    review_body: "Planning Board (site plan); Zoning Board of Adjustment (if a variance is needed)"
    submission_requirements:
      - item: "Site plan application (Planning Board)"
        citation: "https://library.municode.com/nj/jersey_city/codes/code_of_ordinances?nodeId=CH56PLBO"
      - item: "Zoning compliance review"
        citation: "https://www.jerseycitynj.gov/cityhall/housinganddevelopment/zoning"
      - item: "Building permit application (Jersey City Online Permitting and Licensing Portal)"
        citation: "https://www.jerseycitynj.gov/cityhall/HousingAndDevelopment/constructioncode/codes___ordinances"
  small-commercial:
    triggering_conditions: ["new construction", "change of use", "tenant fit-out affecting egress/occupancy"]
    likely_permits: ["Zoning permit/certificate", "Site plan approval (Planning Board, if new construction/major alteration)", "Building permit (DOB)"]
    hearing_likelihood: "by-right (interior fit-out) or variance-likely (new construction) -- depends on scope"
    hearing_likelihood_basis: >
      A tenant fit-out with no exterior/site work is typically a
      by-right building-permit path; new construction or a change of
      use triggering parking/site standards falls back to the same
      Redevelopment-Plan-area-dependent uncertainty as multifamily above.
    review_body: "Planning Board (if site plan triggered); otherwise DOB only"
    submission_requirements:
      - item: "Zoning compliance review"
        citation: "https://www.jerseycitynj.gov/cityhall/housinganddevelopment/zoning"
      - item: "Building permit application"
        citation: "https://www.jerseycitynj.gov/cityhall/HousingAndDevelopment/constructioncode/codes___ordinances"
