[project]
name = "jurisdiction-os-pipeline"
version = "0.1.0"
description = "Jurisdiction Intelligence OS data pipeline: recon, permit ETL, scorecards, playbooks/checklists, signal-feed extraction, delay alerts (OPERATING_GUIDE.md §6)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "openai>=1.50",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ISC004 (implicit multi-line string concat inside a list/tuple literal)
# is stylistic only -- this project uses that pattern throughout for
# report/doc generation (00_recon.py's RECON.md writer, REJECTED_CANDIDATES),
# and Python's actual behavior there is unambiguous. Not worth wrapping
# every one in an extra parens layer for a linter opinion, not a bug risk.
ignore = ["ISC004"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately use naive datetimes, matching the production
# code's own convention for permit dates -- real DuckDB TIMESTAMP columns
# and Socrata's ISO8601 dates are naive, not tz-aware, so a tz-aware test
# fixture would be *inconsistent* with what classify_duration() actually
# receives in production, not more correct.
"tests/*" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
